# Render Blueprint: Dashboard > New > Blueprint > pick this repo.
# Values marked "sync: false" are asked for in the dashboard (never commit secrets here).
services:
  - type: web
    name: charaforge
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MOCK_AI
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL # Neon connection string (postgresql://...?sslmode=require)
        sync: false
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT_URL # https://<account-id>.r2.cloudflarestorage.com
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        value: charaforge
      - key: S3_REGION
        value: auto
      - key: VITE_SITE_URL # your public URL, e.g. https://charaforge.onrender.com (used for share previews)
        sync: false
      - key: CORS_ORIGINS # same as VITE_SITE_URL
        sync: false
      - key: ADMIN_EMAILS # your email: lets you remove inappropriate community posts
        sync: false
