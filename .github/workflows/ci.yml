name: CI
# Every push / PR: typecheck, build, static security checks, dependency audit.
# Push to main (when Cloudflare secrets exist): deploy to STAGING and run the smoke + security test suites there.
# Production is never deployed from here - see deploy-production.yml (manual + approval).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:security
      - run: npm run check:i18n
      - name: Dependency audit (fails on high/critical)
        run: npm run audit

  staging:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: "package-lock.json\nfrontend/package-lock.json" }
      - name: Skip when Cloudflare secrets are not configured
        id: gate
        run: echo "ok=$([ -n "$CLOUDFLARE_API_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.ok == 'true'
        run: npm ci && npm ci --prefix frontend
      - if: steps.gate.outputs.ok == 'true'
        run: npm run deploy:staging
      - if: steps.gate.outputs.ok == 'true'
        name: Test staging (functional + security)
        env:
          BASE: https://staging.characterforge-3u3.pages.dev
        run: |
          sleep 15
          npm run smoke
          npm run test:security
