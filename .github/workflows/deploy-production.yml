name: Deploy to production
# Manual only (Actions > Deploy to production > Run workflow). Protect the "production" environment in
# GitHub > Settings > Environments with "Required reviewers" so a second person must approve.
# Order: tests on staging must pass → encrypted backup of production → migrate → deploy → smoke test.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm'
        required: true

permissions:
  contents: read

jobs:
  staging-tests:
    runs-on: ubuntu-latest
    env:
      BASE: https://staging.characterforge-3u3.pages.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run smoke
      - run: npm run test:security

  production:
    needs: staging-tests
    if: inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: "package-lock.json\nfrontend/package-lock.json" }
      - run: npm ci && npm ci --prefix frontend
      - name: Encrypted backup before deploying
        run: npm run backup -- characterforge
      - uses: actions/upload-artifact@v4
        with:
          name: pre-deploy-backup-${{ github.run_id }}
          path: backups/
          retention-days: 30
      - run: npm run deploy:production
      - name: Smoke test production
        env:
          BASE: https://characterforge-3u3.pages.dev
        run: sleep 15 && npm run smoke
