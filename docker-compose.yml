# Local production-like run: one container (API + built frontend) + PostgreSQL.
#   docker compose up --build   ->  http://localhost:8000
services:
  app:
    build:
      context: .
      args:
        INSTALL_AI: "false"
        VITE_SITE_URL: http://localhost:8000
    environment:
      ENVIRONMENT: development
      MOCK_AI: "true"
      DATABASE_URL: postgresql://charaforge:charaforge@db:5432/charaforge
      STORAGE_BACKEND: local
      CORS_ORIGINS: http://localhost:8000
    volumes:
      - storage:/srv/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: charaforge
      POSTGRES_PASSWORD: charaforge
      POSTGRES_DB: charaforge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charaforge"]
      interval: 3s
      retries: 20

volumes:
  storage:
  pgdata:
